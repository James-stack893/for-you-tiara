<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You Tiara 🌸</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#fff0f6}
#pinPage{position:fixed;inset:0;background:linear-gradient(135deg,#ffd6e8,#fff);display:flex;justify-content:center;align-items:center;z-index:100}
.pinBox{background:white;padding:30px;border-radius:25px;text-align:center;box-shadow:0 10px 30px #0002}.pinBox h2{color:#ff4f91}
#pin{width:180px;padding:13px;border:2px solid #ff9fc3;border-radius:15px;text-align:center;font-size:20px;outline:none}
#enter{margin-top:15px;padding:12px 30px;border:0;border-radius:20px;background:#ff5b9a;color:white;font-size:16px}
#main{display:none;position:fixed;inset:0;background:linear-gradient(#fff7fb,#ffddec);text-align:center}
.flower{position:absolute;font-size:70px;animation:muncul 1.5s ease forwards}.f1{left:15%;top:20%}.f2{right:15%;top:30%;animation-delay:.7s}.f3{left:42%;top:15%;animation-delay:1.2s}.f4{left:25%;bottom:15%;animation-delay:1.8s}.f5{right:25%;bottom:18%;animation-delay:2.3s}
@keyframes muncul{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#messageBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:85%;max-width:400px;min-height:170px;background:white;border-radius:25px;padding:25px;box-shadow:0 10px 35px #0002;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20}
#message{color:#ff4387;font-size:21px;font-weight:bold;line-height:1.5;animation:gerak .8s ease}
@keyframes gerak{0%{transform:scale(.5) translateY(30px);opacity:0}60%{transform:scale(1.1) translateY(-5px)}100%{transform:scale(1) translateY(0);opacity:1}}
#finalBox{display:none}#question{color:#ff4387;font-size:20px;font-weight:bold;margin-bottom:10px}.buttons{display:flex;gap:12px;justify-content:center;margin-top:15px}
button.answer{border:0;padding:12px 18px;border-radius:20px;font-weight:bold;color:white;font-size:15px}#send{background:#c66b91}#no{background:#999;position:relative}
</style></head><body>
<div id="pinPage"><div class="pinBox"><h2>Masukkan PIN 🌸</h2><input id="pin" type="password" maxlength="4" placeholder="PIN"><br><button id="enter">MASUK 💗</button><p id="wrong" style="color:red"></p></div></div>
<div id="main"><div class="flower f1">🌸</div><div class="flower f2">🌷</div><div class="flower f3">🌹</div><div class="flower f4">🌸</div><div class="flower f5">🌷</div>
<div id="messageBox"><div id="normalMessage"><div id="message"></div></div><div id="finalBox"><div id="question">KEPUTUSAN 😋</div><div style="color:#555;margin-bottom:10px">plesee kirrimm dongg sayanggg👉👈</div><div class="buttons"><button class="answer" id="send">KIRIM!</button><button class="answer" id="no">NGGAK MAU</button></div></div></div></div>
<audio id="music" src="music.mp3" loop preload="auto"></audio>
<script>
const PIN_BENAR="0508";
const pesan=["kirrimm potoo kmuu dongg yanggg☹️","kirimm videoo kmuu yanggg di sg ituuu yanggg","akuuu mauuu liattt kecantikannn kmuuu 🌹","bayarrr kangenn akuu pakee videoo kmuuu","nggga mauuu tauu pokoknyaa kmuu haruss kirimm videoo ittuuu😤"];
let index=0;
const pinPage=document.getElementById("pinPage"),main=document.getElementById("main"),pin=document.getElementById("pin"),enter=document.getElementById("enter"),wrong=document.getElementById("wrong"),music=document.getElementById("music"),messageBox=document.getElementById("messageBox"),message=document.getElementById("message"),normalMessage=document.getElementById("normalMessage"),finalBox=document.getElementById("finalBox");
enter.onclick=mulai;pin.addEventListener("keydown",e=>{if(e.key==="Enter")mulai()});
function mulai(){if(pin.value!==PIN_BENAR){wrong.textContent="PIN salah 😭";pin.value="";return}pinPage.style.display="none";main.style.display="block";music.currentTime=0;music.play().catch(()=>{});setTimeout(()=>{messageBox.style.display="flex";tampilPesan()},3500)}
function tampilPesan(){if(index<pesan.length){normalMessage.style.display="block";finalBox.style.display="none";message.textContent=pesan[index];message.style.animation="none";void message.offsetWidth;message.style.animation="gerak .8s ease";index++;setTimeout(tampilPesan,2500)}else{normalMessage.style.display="none";finalBox.style.display="block"}}
const no=document.getElementById("no");function kabur(){const x=Math.random()*180-90,y=Math.random()*100-50;no.style.transform=`translate(${x}px,${y}px)`}no.addEventListener("mouseover",kabur);no.addEventListener("touchstart",kabur);
document.getElementById("send").onclick=()=>alert("hehehe makasihhh 😭❤️");
</script></body></html>
